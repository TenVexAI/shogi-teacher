version: '3.8'

services:
  server:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - DEBUG=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8080/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # For local development only - uncomment to use
  # server-dev:
